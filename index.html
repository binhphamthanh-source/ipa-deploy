<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Install App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      color: white;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .icon {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      margin: 0 auto 20px;
      object-fit: cover;
      background: white;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .version {
      opacity: 0.75;
      margin-bottom: 25px;
    }

    .install {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      background: #fff;
      color: #2563eb;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition: 0.2s;
    }

    .install:active {
      transform: scale(0.97);
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Change this to your app icon -->
    <img
      class="icon"
      src="icon.png"
      alt="App Icon"
    >

    <h1>My App</h1>

    <div class="version">
      Version 1.0.0
    </div>

    <!-- OTA INSTALL BUTTON -->
    <a
      class="install"
      href="itms-services://?action=download-manifest&url=https://YOUR-USERNAME.github.io/YOUR-REPO/manifest.plist"
    >
      Install App
    </a>

    <div class="note">
      Open this page in Safari on your iPhone or iPad,
      then tap "Install App".
    </div>

  </div>

</body>
</html>
